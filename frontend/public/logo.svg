<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Forge Steel Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Background Forge Glow -->
  <circle cx="50" cy="50" r="32" fill="#F97316" opacity="0.15" filter="url(#glow)" />

  <!-- Fiery Flame / Forge Spark Core -->
  <path d="M50 18 C50 18, 62 32, 62 44 C62 52, 56 58, 50 58 C44 58, 38 52, 38 44 C38 32, 50 18, 50 18 Z" 
        fill="url(#flameGrad)" filter="url(#glow)" />

  <!-- Inner Hot White Core Flame -->
  <path d="M50 30 C50 30, 56 38, 56 46 C56 50, 53 53, 50 53 C47 53, 44 50, 44 46 C44 38, 50 30, 50 30 Z" 
        fill="#FEF08A" />

  <!-- Stylized Modern Anvil / Engineering Base -->
  <path d="M22 62 L78 62 L70 70 L64 70 L60 80 L72 80 L72 84 L28 84 L28 80 L40 80 L36 70 L30 70 Z" 
        fill="url(#steelGrad)" />

  <!-- Code Bracket Left < -->
  <path d="M24 40 L16 48 L24 56" 
        stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right > -->
  <path d="M76 40 L84 48 L76 56" 
        stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Strike Spark Point -->
  <circle cx="50" cy="62" r="3" fill="#FFFFFF" filter="url(#glow)" />
</svg>
